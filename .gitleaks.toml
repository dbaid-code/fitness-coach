# gitleaks: default rules plus the two key formats this app uses (security-and-privacy.md §4).
[extend]
useDefault = true

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-[A-Za-z0-9_\-]{20,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "supabase-secret-key"
description = "Supabase secret key"
regex = '''sb_secret_[A-Za-z0-9_\-]{20,}'''
keywords = ["sb_secret_"]

[allowlist]
description = "Test fixtures with obviously fake values"
paths = ['''src/lib/security/.*\.test\.ts''', '''src/server/config/env\.test\.ts''', '''tests/helpers/test-env\.ts''']
# CLAUDE.md:55 is a Playwright command that the generic rule mistakes for a key.
regexes = ['''chromium-pixel7''']
