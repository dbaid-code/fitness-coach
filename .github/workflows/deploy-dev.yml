name: deploy-dev
# D-56: every merge to main brings the hosted dev database in line with the code: migrations, seed data
# (always upserted, D-57) and exercise images. No eval gate here; that stays on production (deploy.yml).
# /api/v1/health on a preview then reports ready (D-54).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  dev:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL_DEV: ${{ secrets.SUPABASE_DB_URL_DEV }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL_DEV }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY_DEV }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase db push --db-url "$SUPABASE_DB_URL_DEV"
      - run: pnpm db:seed --env dev
      - run: pnpm seed:images --env dev
