name: deploy
# F-20, deployment-and-environments.md §6 with the approved deviations (build notes §6):
# - manual only (workflow_dispatch) and only from main: with the owner as the only writer, running it is
#   the approval (no required reviewers on private repos without Enterprise);
# - no SUPABASE_ACCESS_TOKEN: every hosted-database step uses SUPABASE_DB_URL_*;
# - pinned Vercel CLI (G-9) and the repo's own Supabase CLI (devDependency) instead of an extra action.
# - D-56: dev is no longer deployed here; deploy-dev.yml migrates and seeds it on every push to main.
# - D-58: after the deploy, wait for readiness, then a smoke test with a dedicated account (one real plan).
# Prepared in M7 and NOT run by the build (no deploy, no tags).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  VERCEL_CLI: vercel@63.1.2

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Only main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "deploy runs only from main (got ${GITHUB_REF})" >&2
          exit 1

  production:
    needs: guard
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write # release tag only
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm evals:check
      # The migration always runs before the deploy; migrations are expand → contract (§6).
      - run: pnpm exec supabase db push --db-url "$SUPABASE_DB_URL_PROD"
        env: { SUPABASE_DB_URL_PROD: '${{ secrets.SUPABASE_DB_URL_PROD }}' }
      - run: pnpm db:seed --env prod
        env: { SUPABASE_DB_URL_PROD: '${{ secrets.SUPABASE_DB_URL_PROD }}' }
      - run: pnpm seed:images --env prod
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY_PROD }}
      - run: pnpm dlx "$VERCEL_CLI" pull --yes --environment=production --token "$VERCEL_TOKEN"
      - run: pnpm dlx "$VERCEL_CLI" build --prod --token "$VERCEL_TOKEN"
      - id: deploy
        run: echo "url=$(pnpm dlx "$VERCEL_CLI" deploy --prebuilt --prod --token "$VERCEL_TOKEN")" >> "$GITHUB_OUTPUT"
      # The smoke runs on the production domain: the CSRF check accepts only NEXT_PUBLIC_SITE_URL there.
      - name: Wait for readiness (D-54)
        env: { URL: '${{ vars.PROD_SITE_URL }}' }
        run: |
          for i in $(seq 1 30); do
            body=$(curl -fsS "$URL/api/v1/health" || true)
            echo "$body"
            if echo "$body" | grep -q '"ready":true'; then exit 0; fi
            sleep 10
          done
          echo "::error::Production not ready after 5 minutes: $body"
          exit 1
      - run: pnpm exec playwright install --with-deps chromium
      - name: Smoke (D-58)
        env:
          E2E_PROD_SMOKE: '1'
          E2E_BASE_URL: ${{ vars.PROD_SITE_URL }}
          PROD_SMOKE_EMAIL: ${{ secrets.PROD_SMOKE_EMAIL }}
          PROD_SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
        run: pnpm exec playwright test tests/e2e/prod-smoke.spec.ts --project=chromium-pixel7
      - name: Tag release
        run: |
          d=$(date -u +%Y%m%d); n=$(( $(git tag -l "release-$d-*" | wc -l) + 1 ))
          git tag "release-$d-$n" "$GITHUB_SHA" && git push origin "release-$d-$n"
