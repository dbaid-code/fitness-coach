name: e2e-hosted
# D-54: the existing Playwright suite against each deployed Vercel preview and the hosted dev project, so
# environment problems (migrations, seed, auth settings, email, env vars) show up before merging.
# Report-only. A PR that adds a migration fails here until it merges and deploy-dev applies it; the
# readiness step then names `migrations`.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: 'Preview URL to test (https://…vercel.app)'
        required: true

permissions:
  contents: read

concurrency:
  group: e2e-hosted
  cancel-in-progress: false

jobs:
  e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && startsWith(github.event.deployment.environment, 'Preview'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_BASE_URL: ${{ inputs.url || github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL_DEV }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY_DEV }}
      E2E_ADMIN_DB_URL: ${{ secrets.SUPABASE_DB_URL_DEV }}
      # Mail goes out through Resend (D-55); its test inbox accepts it without bounces.
      E2E_EMAIL_DOMAIN: resend.dev
      E2E_EMAIL_PREFIX: delivered+
    steps:
      - name: Check setup
        run: |
          for v in VERCEL_AUTOMATION_BYPASS_SECRET NEXT_PUBLIC_SUPABASE_URL SUPABASE_SECRET_KEY E2E_ADMIN_DB_URL E2E_BASE_URL; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set (see docs/runbooks/owner-setup-dev.md, hosted e2e)"; exit 1; fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            body=$(curl -fsS -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$E2E_BASE_URL/api/v1/health" || true)
            echo "$body"
            if echo "$body" | grep -q '"ready":true'; then exit 0; fi
            sleep 10
          done
          echo "::error::Not ready after 5 minutes: $body"
          exit 1
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --project=chromium-pixel7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: playwright-report-hosted, path: playwright-report }
