name: ci
on:
  pull_request:
  push:
    branches: [main]

# S-8 (D-48): least privilege; every action pinned to a commit SHA.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: local
  AGENTS_MODE: fake
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  DATABASE_URL: postgresql://gc_app:gc_app_local@127.0.0.1:54322/postgres
  LLM_MONTHLY_BUDGET_USD: '24'

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key-000000
      SUPABASE_SECRET_KEY: ci-placeholder-secret-key-000000000000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm seed:validate
      - run: pnpm build
      - run: pnpm check:bundle
      - run: pnpm audit --prod --audit-level high
      - run: pnpm trace:specs
        continue-on-error: true

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The Supabase CLI comes from devDependencies (exact version in the lockfile, S-8).
      - run: pnpm exec supabase start
      - run: pnpm exec supabase db reset
      - name: Export local keys
        # Newer CLIs print PUBLISHABLE_KEY / SECRET_KEY; older ones ANON_KEY / SERVICE_ROLE_KEY (build notes §5.10).
        run: |
          pnpm exec supabase status -o env | sed -n 's/^PUBLISHABLE_KEY=/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=/p; s/^SECRET_KEY=/SUPABASE_SECRET_KEY=/p' | tr -d '"' >> "$GITHUB_ENV"
      - run: pnpm db:seed --env local
      - run: pnpm test:int
      - run: pnpm exec tsx scripts/check-schema-parity.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: schema-parity, path: test-results/schema-parity }

  # testing-strategy.md §7: E2E smoke (Chromium) on PRs; full suite (Chromium + WebKit, axe) on main.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start
      - run: pnpm exec supabase db reset
      - name: Export local keys
        run: |
          pnpm exec supabase status -o env | sed -n 's/^PUBLISHABLE_KEY=/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=/p; s/^SECRET_KEY=/SUPABASE_SECRET_KEY=/p' | tr -d '"' >> "$GITHUB_ENV"
      - run: pnpm db:seed --env local
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm build
      - name: E2E smoke (pull requests)
        if: github.event_name == 'pull_request'
        run: pnpm test:e2e:smoke
      - name: E2E full (main)
        if: github.event_name != 'pull_request'
        run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: playwright-report, path: playwright-report }

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      # The gitleaks binary is pinned by version and checksum (no third-party action, no licence key).
      - name: Install gitleaks
        run: |
          curl -sSfLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c
          tar xzf gitleaks.tar.gz gitleaks
      - run: ./gitleaks git --config .gitleaks.toml --redact --verbose .

  # D-38: blocking from M6. Fails until evals/results/latest.json is a real, passing run for the current
  # prompts, agent config, rulebook and seed data (`pnpm evals:full` via the evals workflow).
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm evals:check
