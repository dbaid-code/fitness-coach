name: dev-rebuild
# D-56: one-time rebuild of the hosted dev database from the migrations (it was set up by pasting the schema,
# so `supabase db push` can't apply over it). Drops the app schemas and cron jobs (scripts/dev-rebuild.ts),
# then applies every migration, the seed and the exercise images. Dev only; accounts in auth.users survive.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type wipe-dev to drop and rebuild the dev app schemas'
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  rebuild:
    if: inputs.confirm == 'wipe-dev' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL_DEV: ${{ secrets.SUPABASE_DB_URL_DEV }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL_DEV }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY_DEV }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/dev-rebuild.ts --confirm "${{ inputs.confirm }}"
      - run: pnpm exec supabase db push --db-url "$SUPABASE_DB_URL_DEV"
      - run: pnpm db:seed --env dev
      - run: pnpm seed:images --env dev
