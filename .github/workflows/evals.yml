name: evals
# evaluations.md §6: full EV-1 – EV-5 run with the dev-workspace key; the developer commits latest.json.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Optional single suite (ev2, ev3, ev4, ev5); empty = full run'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Run evals
        env:
          ANTHROPIC_API_KEY_EVALS: ${{ secrets.ANTHROPIC_API_KEY_EVALS }}
          SUITE: ${{ inputs.suite }}
        run: |
          if [ -n "$SUITE" ]; then pnpm exec tsx --conditions react-server evals/run-evals.ts --suite "$SUITE"; else pnpm evals:full; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eval-results
          path: |
            evals/results/latest.json
            evals/results/runs/
